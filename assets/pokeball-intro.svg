<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <defs>
    <radialGradient id="flash" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="40%" stop-color="#ffe066" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="pokeshadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#1a3a5c" flood-opacity="0.8"/>
    </filter>
    <filter id="textglow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    /* Pokéball shake and disappear */
    @keyframes shake {
      0% { transform: translate(400px, 110px) rotate(0deg) scale(1); opacity: 1; }
      5% { transform: translate(400px, 110px) rotate(-15deg) scale(1); }
      10% { transform: translate(400px, 110px) rotate(15deg) scale(1); }
      15% { transform: translate(400px, 110px) rotate(-12deg) scale(1); }
      20% { transform: translate(400px, 110px) rotate(10deg) scale(1); }
      25% { transform: translate(400px, 110px) rotate(-5deg) scale(1); }
      30% { transform: translate(400px, 110px) rotate(0deg) scale(1); }
      36% { transform: translate(400px, 110px) rotate(0deg) scale(1.15); }
      42% { transform: translate(400px, 110px) rotate(0deg) scale(0.2); opacity: 0.5; }
      48%, 100% { transform: translate(400px, 110px) rotate(0deg) scale(0); opacity: 0; }
    }

    /* Flash burst from center */
    @keyframes flashBurst {
      0%, 34% { opacity: 0; r: 0; }
      38% { opacity: 1; r: 20; }
      44% { opacity: 0.8; r: 120; }
      52% { opacity: 0; r: 200; }
      100% { opacity: 0; }
    }

    /* Sparkle particles */
    @keyframes sparkle {
      0%, 34% { opacity: 0; }
      40% { opacity: 1; }
      60% { opacity: 0.8; }
      80%, 100% { opacity: 0; }
    }

    /* Name text rising from pokeball */
    @keyframes textRise {
      0%, 36% { opacity: 0; transform: translate(0, 40px) scale(0.3); }
      48% { opacity: 0.7; transform: translate(0, 10px) scale(0.8); }
      58% { opacity: 1; transform: translate(0, -2px) scale(1.03); }
      65%, 100% { opacity: 1; transform: translate(0, 0) scale(1); }
    }

    /* Wave hand animation */
    @keyframes wave {
      0%, 60% { opacity: 0; }
      65% { opacity: 1; transform: rotate(0deg); }
      70% { transform: rotate(16deg); }
      75% { transform: rotate(-8deg); }
      80% { transform: rotate(16deg); }
      85% { transform: rotate(-4deg); }
      90% { transform: rotate(10deg); }
      95%, 100% { transform: rotate(0deg); opacity: 1; }
    }

    .pokeball {
      animation: shake 3.5s ease-in-out forwards;
    }

    .flash {
      animation: flashBurst 3.5s ease-out forwards;
    }

    .sparkle {
      animation: sparkle 3.5s ease-out forwards;
      opacity: 0;
    }

    .name-group {
      animation: textRise 3.5s ease-out forwards;
      opacity: 0;
    }

    .wave {
      animation: wave 3.5s ease-in-out forwards;
      opacity: 0;
      transform-origin: 680px 88px;
    }

    /* Pokémon-style text */
    .poke-text {
      font-family: 'Impact', 'Arial Black', 'Trebuchet MS', sans-serif;
      font-size: 52px;
      font-weight: 900;
      letter-spacing: 2px;
      fill: #FFCB05;
      stroke: #2A75BB;
      stroke-width: 3.5;
      paint-order: stroke fill;
      filter: url(#pokeshadow);
    }
  </style>

  <!-- Flash burst circle -->
  <circle class="flash" cx="400" cy="110" r="0" fill="url(#flash)"/>

  <!-- Sparkle dots -->
  <circle class="sparkle" cx="310" cy="60" r="3" fill="#FFCB05" style="animation-delay: 0s"/>
  <circle class="sparkle" cx="490" cy="50" r="2.5" fill="#fff" style="animation-delay: 0.08s"/>
  <circle class="sparkle" cx="340" cy="130" r="2" fill="#2A75BB" style="animation-delay: 0.12s"/>
  <circle class="sparkle" cx="465" cy="140" r="3" fill="#FFCB05" style="animation-delay: 0.04s"/>
  <circle class="sparkle" cx="280" cy="90" r="2.5" fill="#fff" style="animation-delay: 0.16s"/>
  <circle class="sparkle" cx="520" cy="80" r="2" fill="#FFCB05" style="animation-delay: 0.1s"/>
  <circle class="sparkle" cx="350" cy="40" r="2" fill="#2A75BB" style="animation-delay: 0.2s"/>
  <circle class="sparkle" cx="450" cy="35" r="2.5" fill="#fff" style="animation-delay: 0.14s"/>

  <!-- Pokéball -->
  <g class="pokeball">
    <!-- Top half (red) -->
    <path d="M -30 0 A 30 30 0 0 1 30 0 Z" fill="#EE1515" stroke="#1a1a2e" stroke-width="2.5"/>
    <!-- Bottom half (white) -->
    <path d="M -30 0 A 30 30 0 0 0 30 0 Z" fill="#f0f0f0" stroke="#1a1a2e" stroke-width="2.5"/>
    <!-- Center band -->
    <rect x="-32" y="-3.5" width="64" height="7" fill="#1a1a2e" rx="1"/>
    <!-- Button outer -->
    <circle cx="0" cy="0" r="9" fill="#1a1a2e"/>
    <!-- Button inner -->
    <circle cx="0" cy="0" r="5.5" fill="#f0f0f0" stroke="#1a1a2e" stroke-width="1.8"/>
    <!-- Shine -->
    <ellipse cx="-12" cy="-14" rx="7" ry="3.5" fill="white" opacity="0.45" transform="rotate(-30 -12 -14)"/>
  </g>

  <!-- Name text -->
  <g class="name-group" filter="url(#textglow)">
    <text x="400" y="105" text-anchor="middle" dominant-baseline="central" class="poke-text">
      Hi, I'm Udhaya M
    </text>
  </g>

  <!-- Wave emoji -->
  <text class="wave" x="668" y="100" font-size="42" dominant-baseline="central">👋</text>

</svg>
